server.port=8080
spring.application.name=factorx-backend
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
factorx.news.enabled=false
factorx.news.rss.enabled=false
factorx.news.finnhub.enabled=false
factorx.market.finnhub.enabled=false
factorx.market.finnhub.base-url=https://finnhub.io/api/v1
factorx.market.finnhub.api-key=
factorx.market.history-days=120
factorx.market.relu-threshold=0.004
factorx.market.http.timeout-ms=10000
