spring.config.activate.on-profile=postgres

spring.autoconfigure.exclude=
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/factorx}
spring.datasource.username=${DB_USERNAME:factorx}
spring.datasource.password=${DB_PASSWORD:factorx}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
factorx.news.enabled=${FACTORX_NEWS_ENABLED:false}
factorx.news.poll-interval-ms=${FACTORX_NEWS_POLL_INTERVAL_MS:300000}
factorx.news.max-fetch-attempts=${FACTORX_NEWS_MAX_FETCH_ATTEMPTS:3}
factorx.news.http.connect-timeout-ms=${FACTORX_NEWS_CONNECT_TIMEOUT_MS:5000}
factorx.news.http.read-timeout-ms=${FACTORX_NEWS_READ_TIMEOUT_MS:10000}
factorx.news.rss.enabled=${FACTORX_NEWS_RSS_ENABLED:false}
factorx.news.rss.url=${FACTORX_NEWS_RSS_URL:}
factorx.news.rss.source=${FACTORX_NEWS_RSS_SOURCE:RSS}
factorx.news.finnhub.enabled=${FACTORX_NEWS_FINNHUB_ENABLED:false}
factorx.news.finnhub.base-url=${FACTORX_FINNHUB_BASE_URL:https://finnhub.io/api/v1}
factorx.news.finnhub.category=${FACTORX_FINNHUB_CATEGORY:general}
